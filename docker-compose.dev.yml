version: '3'

services:
  redis:
    container_name: redis
    image: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - omd

  mysql:
    image: mysql
    container_name: mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./src/main/resources/data.sql:/docker-entrypoint-initdb.d/data.sql
    ports:
      - "3307:3306"
    networks:
      - omd
    restart: always

  backend:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    container_name: develop
    depends_on:
      - redis
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      CLOUD_AWS_CREDENTIALS_ACCESS_KEY: ${S3_ACCESS_KEY}  # AWS Access Key
      CLOUD_AWS_CREDENTIALS_SECRET_KEY: ${S3_SECRET_KEY}  # AWS Secret Key
      CLOUD_AWS_REGION_STATIC: ap-northeast-2  # AWS Region, 예: ap-northeast-2
      CLOUD_AWS_S3_BUCKET: omdbucket  # AWS S3 Bucket Name
      naver.api.client.id: ${NAVER_API_CLIENT_ID}
      naver.api.client.secret: ${NAVER_API_CLIENT_SECRET}
    ports:
      - "8080:8080"
    restart: always
    networks:
      - omd

networks:
  omd:
    driver: bridge